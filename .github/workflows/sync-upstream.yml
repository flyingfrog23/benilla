name: Sync upstream

# In Settings > Actions > General, allow GitHub Actions to create pull requests.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'samwhosung/benilla'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Open from the upstream branch directly: no fork ref or workflow file is rewritten by
      # GITHUB_TOKEN, and the merge retains this fork's own commits, including extended auras.
      - name: Open upstream merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$REPO/compare/main...samwhosung:main" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "No upstream commits to merge."
            exit 0
          fi

          # A squash merge keeps no upstream ancestry. Compare the resulting trees as well so
          # already-imported commits do not open another PR after the previous one was squashed.
          git fetch --no-tags https://github.com/samwhosung/benilla.git main
          if merged_tree=$(git merge-tree --write-tree HEAD FETCH_HEAD); then
            if [ "$merged_tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              echo "All upstream changes are already present."
              exit 0
            fi
          else
            merge_status=$?
            # Conflicts need a PR for resolution; other merge errors fail the run.
            if [ "$merge_status" -ne 1 ]; then exit "$merge_status"; fi
          fi

          existing=$(gh api --method GET "repos/$REPO/pulls" \
            -f state=open -f base=main -f head=samwhosung:main \
            --jq '.[0].html_url // empty')
          if [ -n "$existing" ]; then
            echo "Upstream merge pull request already open: $existing"
            exit 0
          fi

          gh pr create --repo "$REPO" --base main --head samwhosung:main \
            --title "Merge upstream/main" \
            --body "Merge the latest upstream commits while preserving this fork's changes. Resolve any conflicts and run the repository gates before merging."
